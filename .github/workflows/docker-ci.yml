name: SplitApp Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      
jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build the Docker image
        run: |
          docker build -t spliteasy-backend:latest .
          
      - name: Configure GCP Credentials
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v0
        with:
          service_account_key: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true
      
      - name: Configure Docker Client
        if: github.ref == 'refs/heads/main'
        run: |-
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Push the Docker image
        if: github.ref == 'refs/heads/main'
        env: 
          ARTIFACT_REGISTRY_URL: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/spliteasy-backend
        run: |
          docker tag spliteasy-backend:latest $ARTIFACT_REGISTRY_URL/spliteasy-backend:latest
          docker push $ARTIFACT_REGISTRY_URL/spliteasy-backend:latest

  deploy-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref == 'refs/heads/main'
    steps:
      - name: Configure GCP Credentials
        uses: google-github-actions/setup-gcloud@v0
        with:
          service_account_key: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true
          
      # deploy to cloud run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@main
        with:
          service_name: "spliteasy-backend"
          image: "asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/spliteasy-backend/spliteasy-backend:latest"
          platform: "managed"
          region: "asia-south1"
          service: "spliteasy-backend"
          port: 3001
          env_vars: |
            NODE_ENV=production
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            LOG_LEVEL=info
